    <main>
        <section class="page-hero">
            <div class="hero-content">
                <h1>CONTACT <span>US</span></h1>
            </div>
        </section>

        <section class="section">
            <div class="contact-grid">
                <div class="contact-card">
                    <h3>Address</h3>
                    <p>Moffett On Main Lifestyle Centre, 109 17th Ave, Charlo, Gqeberha, 6070</p>
                </div>
                <div class="contact-card">
                    <h3>Phone</h3>
                    <p><a href="tel:0410010040">041 001 0040</a></p>
                </div>
                <div class="contact-card">
                    <h3>Email</h3>
                    <p><a href="mailto:moffett@tigersmilk.co.za">moffett@tigersmilk.co.za</a></p>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="form-container">
                <h2>SEND US A MESSAGE</h2>
                <form id="contactForm" action="#" method="post" class="form-grid">
                    <div class="form-group full">
                        <label for="cname">Full Name *</label>
                        <input type="text" id="cname" name="name" required>
                    </div>
                    <div class="form-group full">
                        <label for="cemail">Email *</label>
                        <input type="email" id="cemail" name="email" required>
                    </div>
                    <div class="form-group full">
                        <label for="cmessage">Message *</label>
                        <textarea id="cmessage" name="message" required></textarea>
                    </div>
                    <div class="form-group full">
                        <button type="submit" class="btn btn-primary">SEND MESSAGE</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="section">
            <h2>FIND US ON THE MAP</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3312.8!2d25.568!3d-33.958!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzPCsDU3JzI4LjgiUyAyNcKwMzQnMDQuOCJF!5e0!3m2!1sen!2sza!4v1650000000000" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
